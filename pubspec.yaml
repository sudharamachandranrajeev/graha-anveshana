name: anveshana
description: "Graha Anveshana - property search, renting, buying, investment, development and lettings (Linux, Windows, Android). Part of Brahma."
publish_to: 'none'
version: 0.12.1+19

environment:
  sdk: ^3.13.5

dependencies:
  # Shared core of the Brahma apps. pubspec_overrides.yaml points it at a
  # local checkout during development.
  brahma_core:
    git:
      url: https://github.com/sudharamachandranrajeev/brahma.git
      path: core
  drift: ^2.35.2
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  # The in-app browser, for sites that need one. 6.2 (beta) is the first
  # with a Linux plugin; 6.1's Android build fails under AGP 9.
  flutter_inappwebview: 6.2.0-beta.3
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  google_mlkit_text_recognition: ^1.0.0
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdfrx: 2.6.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

dependency_overrides:
  # The web view's Linux plugin with libwpe made optional: WPE WebKit 2.52+
  # (Arch, Fedora) no longer ships it. See packages/flutter_inappwebview_linux.
  flutter_inappwebview_linux:
    path: packages/flutter_inappwebview_linux

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Bundle SQLite3MultipleCiphers instead of plain SQLite so the local database
# is encrypted at rest on every platform (see doc/hook.md in package:sqlite3).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
